name: IronCandle — Daily EOD Refresh

on:
  workflow_dispatch:
  schedule:
    # 18:30 IST = 13:00 UTC
    - cron: "30 13 * * 1-5"

concurrency:
  group: ironcandle-market-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore compressed market DB from Google Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_FILENAME: iron_candle_market.db.gz
        run: |
          if [ -n "$GOOGLE_REFRESH_TOKEN" ]; then
            python scripts/drive_sync.py pull --local data/iron_candle_market.db.gz
            if [ -f data/iron_candle_market.db.gz ]; then
              python - <<'PY'
              import gzip, shutil
              with gzip.open('data/iron_candle_market.db.gz','rb') as src, open('data/iron_candle_market.db','wb') as dst:
                  shutil.copyfileobj(src,dst)
              print('Restored market DB archive.')
              PY
            fi
          else
            echo "GOOGLE_REFRESH_TOKEN is not configured. Run bootstrap_history.py + Google Drive setup before enabling scheduled refresh." >&2
          fi

      - name: Refresh official NSE EOD market data
        run: python scripts/refresh_market.py

      - name: Archive compressed market DB to Google Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_FILENAME: iron_candle_market.db.gz
        run: |
          python scripts/drive_sync.py push --local data/iron_candle_market.db.gz

      - name: Publish scanner snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/scanner.json public/data/scanner_history.json
          git diff --cached --quiet || git commit -m "chore: refresh IronCandle EOD scanner"
          git push
